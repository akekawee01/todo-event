services:
  mongo:
    image: mongo:8
    container_name: todoe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: todoe
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: todoe-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    container_name: todoe-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoe_onboarding
      MYSQL_USER: todoe
      MYSQL_PASSWORD: todoe
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:latest
    container_name: todoe-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: todoe-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  onboarding:
    build:
      context: .
      dockerfile: cmd/onboarding/Dockerfile
    container_name: todoe-onboarding
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      MYSQL_DSN: todoe:todoe@tcp(mysql:3306)/todoe_onboarding?parseTime=true&multiStatements=true
      MONGO_URI: mongodb://root:root@mongo:27017
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: todoe-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://root:root@mongo:27017
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: services/audit_fastapi/Dockerfile
    container_name: todoe-audit
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      LOKI_URL: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started

  task-ui:
    build:
      context: .
      dockerfile: web/vue/Dockerfile
    container_name: todoe-task-ui
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_started

  onboarding-ui:
    build:
      context: .
      dockerfile: web/onboarding/Dockerfile
    container_name: todoe-onboarding-ui
    restart: unless-stopped
    ports:
      - "5174:8080"
    depends_on:
      api:
        condition: service_started
      onboarding:
        condition: service_started

volumes:
  mongo-data:
  grafana-data:
  rabbit-data:
  mysql-data:
